version: 2
updates:
  # Cargo workspace dependency updates — version bumps in
  # Cargo.toml / Cargo.lock, PRs opened against `main`. Mirrors
  # the original C repo's Dependabot config (which tracked GitHub
  # Actions); this version adds a Cargo ecosystem.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "ci"]

  # GitHub Actions version bumps. Inherited from the original
  # config (closes an "unmaintained action" class of audit
  # alerts).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["actions/*", "github/*"]
      third-party:
        patterns: ["*"]
        exclude-patterns: ["actions/*", "github/*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
