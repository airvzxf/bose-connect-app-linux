name: Codacy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '16 17 * * 6'
  workflow_dispatch:

jobs:
  codacy-security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Analysis CLI
        uses: codacy/codacy-analysis-cli-action@1.1.0
        with:
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          # Use a dedicated category so the Codacy run does not collide with
          # the CodeQL workflow (which uploads to the default `codeql`
          # category). GitHub refuses multiple SARIF runs sharing the same
          # category since July 2025. upload-sarif@v3 is required because
          # the Codacy CLI emits a SARIF that bundles multiple `runs`.
          category: codacy
