name: Codacy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '16 17 * * 6'
  workflow_dispatch:

jobs:
  codacy-security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      # Since the 2025-07-22 GitHub Code Scanning change, the upload-sarif
      # action rejects SARIF files whose `runs[]` entries are not unique by
      # (automationDetails.id, tool.driver.name). With gh-code-scanning-compat
      # enabled, the Codacy CLI emits one `runs[]` entry per internal tool
      # (clang-tidy, semgrep, eslint, ...) but they all share
      # tool.driver.name="Codacy". Stamp a unique automationDetails.id on
      # every run before uploading so the action accepts the SARIF. See
      # https://github.blog/changelog/2025-07-21-code-scanning-will-stop-combining-multiple-sarif-runs-uploaded-in-the-same-sarif-file/
      - name: Stamp unique automationDetails.id per SARIF run
        run: |
          set -euo pipefail
          jq '
            .runs |= (
              [ range(0; length) as $i | .[$i]
                | .automationDetails = {
                    id: ("codacy/"
                          + (.tool.driver.name // "codacy")
                          + "/" + ($i | tostring))
                  }
              ]
            )
          ' results.sarif > results-fixed.sarif
          mv results-fixed.sarif results.sarif

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
          # Dedicated category so the Codacy run does not collide with the
          # CodeQL workflow (which uploads to the default `codeql` category).
          category: codacy
