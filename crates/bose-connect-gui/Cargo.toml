[package]
name = "bose-connect-gui"
version.workspace = true
edition.workspace = true
# parking_lot 0.13 needs 1.95.
rust-version = "1.95"
# Not published to crates.io; only the `bose-connect` library is.
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "GTK4 desktop GUI for controlling Bose Bluetooth headphones over RFCOMM."

[dependencies]
bose-connect.workspace = true

# Async runtime: tokio for the few async service tasks.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# Serde for persistent state and friends.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror.workspace = true
anyhow.workspace = true

# Logging: stderr, honouring RUST_LOG.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Config persistence: store `~/.config/bose-connect/state.json`.
directories = "6"

# Pure-Rust desktop notifications via D-Bus (libnotify).
notify-rust = { version = "4", default-features = false, features = ["z", "z-with-tokio", "images_no_default_features"] }

# GUI core. We pin the stack together so `gtk4-sys` doesn't mismatch.
gtk = { package = "gtk4", version = "0.11", features = ["v4_22", "gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
# Image loading for the SNI IconPixmap. We render the SVG from
# the GResource bundle at tray size and 2× for HiDPI.
gdk-pixbuf = "0.22"

once_cell = "1"
parking_lot = "0.13"
rand = "0.10"
flume = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
cairo-rs = "0.22"
fluent-bundle = "0.16"
unic-langid = "0.9"

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
fluent-syntax = "0.12"
# `assets` module tests use a tempdir-backed $XDG_DATA_HOME.
tempfile = "3"

[lib]
name = "bose_connect_gui"
path = "src/lib.rs"

[[bin]]
name = "bose-connect-gui"
path = "src/main.rs"

# `cargo deb -p bose-connect-gui` (https://github.com/kornelski/cargo-deb)
# builds the Debian / Ubuntu package. Build both binaries first, then
# pack without building: see packaging/README.md.
[package.metadata.deb]
name = "bose-connect"
maintainer = "Israel Roldan <israel.alberto.rv@gmail.com>"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Controls Bose Bluetooth headphones and speakers over the same RFCOMM \
protocol as the Bose apps: battery, noise cancelling and audio modes, \
paired sources, media keys, and party and stereo mode for two \
speakers. Ships a GTK 4 and libadwaita window (bose-connect-gui) and \
a command line tool (bose-connect-app-linux). It needs GTK 4.22 and \
libadwaita 1.9 or newer."""
section = "sound"
priority = "optional"
# `$auto` reads the libraries the binaries link (dpkg-shlibdeps).
depends = "$auto, libgtk-4-1 (>= 4.22), libadwaita-1-0 (>= 1.9), bluez"
recommends = "pulseaudio-utils | pipewire-pulse"
assets = [
    ["target/release/bose-connect-gui", "usr/bin/", "755"],
    ["target/release/bose-connect-app-linux", "usr/bin/", "755"],
    ["../../packaging/linux/desktop/bose-connect-gui.desktop", "usr/share/applications/com.airvzxf.bose-connect-gui.desktop", "644"],
    ["../../packaging/linux/metainfo/com.airvzxf.bose-connect-gui.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/icons/hicolor/scalable/apps/bose-connect-gui.svg", "usr/share/icons/hicolor/scalable/apps/com.airvzxf.bose-connect-gui.svg", "644"],
    ["../../packaging/linux/icons/hicolor/symbolic/apps/bose-connect-gui.svg", "usr/share/icons/hicolor/symbolic/apps/com.airvzxf.bose-connect-gui-symbolic.svg", "644"],
    ["../../packaging/linux/bash-completion/bose-connect-gui", "usr/share/bash-completion/completions/", "644"],
    ["../../README.md", "usr/share/doc/bose-connect/", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/bose-connect/", "644"],
]
