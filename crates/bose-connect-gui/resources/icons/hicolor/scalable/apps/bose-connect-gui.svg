<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1437"/>
      <stop offset="55%" stop-color="#0e1a4f"/>
      <stop offset="100%" stop-color="#1e2a78"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#3ab9ff"/>
    </linearGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background with a subtle vignette -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#g1)"/>

  <!-- Concentric "quiet" rings: noise cancellation metaphor -->
  <g fill="none" stroke="url(#g2)" stroke-width="4" opacity="0.85">
    <circle cx="128" cy="128" r="36"/>
    <circle cx="128" cy="128" r="56" opacity="0.7"/>
    <circle cx="128" cy="128" r="78" opacity="0.5"/>
    <circle cx="128" cy="128" r="100" opacity="0.3"/>
  </g>

  <!-- Headphone silhouette over the rings -->
  <g transform="translate(128 132)" fill="url(#g2)" stroke="#0b1437" stroke-width="3" stroke-linejoin="round">
    <!-- headband arc -->
    <path d="M -76 0 A 76 76 0 0 1 76 0 L 64 0 A 64 64 0 0 0 -64 0 Z"/>
    <!-- left cup -->
    <rect x="-92" y="-2" width="40" height="62" rx="16"/>
    <rect x="-86" y="6" width="28" height="46" rx="10" fill="#0b1437"/>
    <rect x="-80" y="12" width="16" height="34" rx="6" fill="url(#g2)"/>
    <!-- right cup -->
    <rect x="52" y="-2" width="40" height="62" rx="16"/>
    <rect x="58" y="6" width="28" height="46" rx="10" fill="#0b1437"/>
    <rect x="64" y="12" width="16" height="34" rx="6" fill="url(#g2)"/>
  </g>

  <!-- Quiet sparkle -->
  <circle cx="196" cy="60" r="22" fill="url(#g3)"/>
</svg>
