[package]
name = "bose-connect-cli"
version.workspace = true
edition.workspace = true
# uuid 1.29 and zbus 6.5 need 1.89.
rust-version = "1.89"
# Not published to crates.io; only the `bose-connect` library is.
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Command-line interface for the Bose Connect protocol (RFCOMM over Bluetooth)."

[[bin]]
name = "bose-connect-app-linux"
path = "src/main.rs"

[dependencies]
bose-connect = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
# BlueZ audio state over D-Bus (`--audio-state`). Already in the
# lockfile through the GUI's notify-rust.
zbus = "6"
