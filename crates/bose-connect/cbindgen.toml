# cbindgen configuration for `bose-connect`.
#
# The generated header is the public C ABI surface of the library.
# Any change here ripples to every downstream C/C++/Python/Ruby/etc.
# consumer, so review generated diffs carefully.
language = "C"
include_version = true
include_guard = "BOSE_CONNECT_H"
namespace = "bose_connect"
namespaces = []
cpp_compat = false
documentation = true
documentation_length = "full"
tab_width = 4
line_length = 100
style = "both"
header = """
/* Auto-generated by cbindgen from `bose-connect` — DO NOT EDIT.
 *
 * Source crate: https://github.com/airvzxf/bose-connect-app-linux
 * Protocol: reverse-engineered Bose Connect RFCOMM protocol (Bose
 *           QuietComfort 35 / SoundLink II series).
 *
 * Threading: every function in this header is synchronous and
 * NOT thread-safe on the same `BoseConnect` handle. Use one
 * handle per thread, or guard externally with a mutex.
 *
 * Lifetime: the `BoseConnect` handle owns the underlying RFCOMM
 * socket; `bose_connect_close` (or the `BoseConnect` destructor)
 * closes the socket. After close, every other function on the
 * handle returns `BOSE_CONNECT_ERR_CLOSED`.
 */
"""
trailer = """
/* End of auto-generated header. */
"""
