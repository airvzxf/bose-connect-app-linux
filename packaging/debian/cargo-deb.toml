# Configuration for `cargo deb` (https://github.com/kornelski/cargo-deb).
# Drop this into the workspace root and run `cargo deb` to produce a
# working .deb that places the binary in /usr/bin, the desktop file
# in /usr/share/applications, the AppStream metadata in
# /usr/share/metainfo, and the bash-completion in
# /usr/share/bash-completion/completions.
#
# Use the layout that `cargo deb` expects (the [package.metadata.deb]
# table) so a single `cargo deb` invocation produces the .deb from
# the workspace.

[package.metadata.deb]
# The package name follows the Debian convention of lowercased
# upstream name with hyphens. The application_id stays
# `com.airvzxf.bose-connect-gui` (reverse-DNS) per the
# freedesktop spec.
name = "bose-connect-gui"
version = "0.2.0"
edition = "1.0"
description = "GTK4 + libadwaita front-end for the bose_connect RFCOMM library"
extended-description = """\
Bose Connect for Linux is a reverse-engineered Linux port of the \
Bose Connect app, originally forked from Denton-L/based-connect. \
This package is the GTK4 + libadwaita + Relm4 GUI that wraps the \
upstream bose_connect library and lets you drive a Bose \
QuietComfort or SoundLink headphone from a modern Linux desktop \
without vendor-supplied tooling. The same byte-level protocol \
that the original C codebase spoke is preserved in the lower-level \
crates/ subfolder.\
"""
# Multi-line `maintainer` is allowed; cargo-deb uses the first line
# as the `Maintainer:` field in the .deb control file.
maintainer = "Israel Roldan <israel.alberto.rv@gmail.com>"
license-file = ["LICENSE", "GPL-3.0-only"]
depends = [
    "libc6",
    "libglib2.0-0t64",
    "libgtk-4-1t64",
    "libadwaita-1-0t64",
    # `notify-rust` uses libnotify under the hood on Linux.
    "libnotify4",
    # `tokio` requires NPTL on Debian, which the base system already provides.
]
# We do not depend on a specific D-Bus daemon; the GUI registers on
# the session bus at runtime.
section = "sound"
priority = "optional"
# The assets in the workspace that `cargo deb` should bundle into
# the .deb. Paths are relative to the workspace root.
assets = [
    ["target/debian/bose-connect-gui", "usr/bin/", "755"],
    ["target/debian/bose-connect-app-linux", "usr/bin/", "755"],
    ["target/debian/libbose_connect.so", "usr/lib/x86_64-linux-gnu/", "644"],
    ["packaging/linux/bose-connect-gui.desktop",
     "usr/share/applications/com.airvzxf.bose-connect-gui.desktop",
     "644"],
    ["packaging/linux/com.airvzxf.bose-connect-gui.metainfo.xml",
     "usr/share/metainfo/com.airvzxf.bose-connect-gui.metainfo.xml",
     "644"],
    ["packaging/linux/bose-connect-gui.bash-completion",
     "usr/share/bash-completion/completions/bose-connect-gui",
     "644"],
    ["crates/bose-connect-gui/resources/icons/hicolor/scalable/apps/bose-connect-gui.svg",
     "usr/share/icons/hicolor/scalable/apps/com.airvzxf.bose-connect-gui.svg",
     "644"],
    ["crates/bose-connect-gui/resources/icons/hicolor/symbolic/apps/bose-connect-gui.svg",
     "usr/share/icons/hicolor/symbolic/apps/com.airvzxf.bose-connect-gui-symbolic.svg",
     "644"],
]
# Post-install hook: refresh the icon cache so the new SVG is
# visible in the application launcher immediately. This is the
# canonical Debian hicolor step.
post_install = "postinst"
extended-maintainer-scripts = true

# The `package.metadata.deb-manifest.targets` table lets us author
# extra .deb metadata without re-running `cargo deb` on every
# change. The `changelog` is referenced as a relative path.
[package.metadata.deb-manifest.targets]
# The static man-page will be generated by `cargo deb` from the
# help text; for now we keep the package size lean and skip it.
# Uncomment to enable:
# [[package.metadata.deb-manifest.targets]]
# path = "/usr/share/man/man1/bose-connect-gui.1"
# source = "packaging/linux/bose-connect-gui.1"

# The Debian changelog lives at debian/changelog once `cargo deb`
# runs. We keep a generator script in `packaging/debian/` that
# initialises the changelog from the git log on each release.
[package.metadata.deb.generate-changelog]
path = "packaging/debian/changelog"
ranges = true

# Files that must be present for `cargo deb` to succeed even
# when the binary lives in a different crate's target/.
[package.metadata.cargo-all-features]
# Defer to each crate's own `default` features; this prevents
# `cargo deb --no-default-features` from accidentally stripping
# out the FFI surface of the lower-level `bose-connect` crate.
resolver = "2"
